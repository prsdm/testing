services:
  relational_db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-kimi}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - kimi-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kimi}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  # In-stack Redis (Onyx-style): session cache, rate limits, resumable streams.
  # Do not use a shared cloud Redis per customer — ship this with each deploy.
  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

  vespa:
    image: vespaengine/vespa:8.609.39
    hostname: vespa
    restart: unless-stopped
    environment:
      - VESPA_SKIP_UPGRADE_CHECK=true
    ports:
      - "8080:8080"
      - "19071:19071"
    volumes:
      - vespa-data:/opt/vespa/var
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:19071/state/v1/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  model_server:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    platform: linux/amd64
    environment:
      - HF_HOME=/data
      - HUGGINGFACE_HUB_CACHE=/data
    command:
      - --model-id
      - ${QUERY_EMBEDDING_MODEL_ID:-BAAI/bge-base-en-v1.5}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
      - --auto-truncate
    ports:
      - "9000:80"
    volumes:
      - model-server-cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  indexing_model_server:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    platform: linux/amd64
    environment:
      - HF_HOME=/data
      - HUGGINGFACE_HUB_CACHE=/data
    ports:
      - "9001:80"
    volumes:
      - indexing-model-server-cache:/data
    command:
      - --model-id
      - ${INDEXING_EMBEDDING_MODEL_ID:-BAAI/bge-base-en-v1.5}
      - --hostname
      - 0.0.0.0
      - --port
      - "80"
      - --auto-truncate
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

volumes:
  kimi-pg-data:
  vespa-data:
  model-server-cache:
  indexing-model-server-cache:
